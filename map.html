<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FavollApp</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Iosevka+Charon:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Leckerli+One&family=Momo+Signature&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
<script src="https://kit.fontawesome.com/de9ea88d4a.js" crossorigin="anonymous"></script>
<link href="https://emoji-css.afeld.me/emoji.css" rel="stylesheet">

<script src="warehouse.js"></script>

<link rel="icon" type="image/png" sizes="32x32" href="assets/Orange-Crab-Clipart-Transparent-PNG.png">
<link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">   
</head>
<body>

<div class="header">
  <a href="index.html" class="header-title">FavollApp</a>&ensp;
  <a href="index.html"><img id="favollo-img" src="assets/Orange-Crab-Clipart-Transparent-PNG.png" alt=""></a>
</div>

<div class="container">

  <div class="title">
    <h1>La mappa del Favollo</h1>
    <h3>Luoghi vicino a noi</h3>
  </div>

<br>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<div id="map" style="height: 400px;"></div>

<script>
  const map = L.map('map').setView([41.74067, 2.77950], 11);

  /*icone marker*/
  const markerHome = L.divIcon({
  className: 'marker-icon',
  html: `<span class="marker-icon">🏠</span>`,
  iconSize: [30, 30]
});

  const markerSupermkt = L.divIcon({
  className: 'marker-icon',
  html: `<span class="marker-icon">🛒</span>`,
  iconSize: [30, 30]
});

  const markerBeach = L.divIcon({
  className: 'marker-icon',
  html: `<span class="marker-icon">🏖️</span>`,
  iconSize: [30, 30]
});

  const markerGasSt = L.divIcon({
  className: 'marker-icon',
  html: `<span class="marker-icon">⛽</span>`,
  iconSize: [30, 30]
});

  const markerPharma = L.divIcon({
  className: 'marker-icon',
  html: `<span class="marker-icon">⚕️</span>`,
  iconSize: [30, 30]
});

  const markerAtm = L.divIcon({
  className: 'marker-icon',
  html: `<span class="marker-icon">🏧</span>`,
  iconSize: [30, 30]
});

/*Actual map*/
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  /*Casa*/
  L.marker([41.74067, 2.77950], {icon: markerHome}).addTo(map)
    .bindPopup("<h3>Casa</h3>La tana del Favollo")
    .openPopup();

  /*Supermercati*/
  L.marker([41.786076677811394, 2.7387182931999092], {icon: markerSupermkt}).addTo(map)
    .bindPopup ("<h3>Bonpreu</h3>11 minuti")
    .openPopup();

  L.marker([41.71706945522734, 2.8304102905593913], {icon: markerSupermkt}).addTo(map)
    .bindPopup ("<h3>ALDI</h3>12 minuti")
    .openPopup();

  /*Farmacie*/
  L.marker([41.78926414240818, 2.7765310138230435], {icon: markerPharma}).addTo(map)
    .bindPopup ("<h3>Farmacia Jùlia Vilardell</h3>8 minuti")
    .openPopup();

  L.marker([41.79227360882879, 2.781447938445466], {icon: markerPharma}).addTo(map)
    .bindPopup ("<h3>Farmacia Morè Fàbregas</h3>11 minuti")
    .openPopup();
  
  L.marker([41.71205615755278, 2.8408439723396652], {icon: markerPharma}).addTo(map)
    .bindPopup ("<h3>Farmacia 24H Lloret de Mar</h3>14 minuti")
    .openPopup();

  /*Bancomat*/
  L.marker([41.79345647670497, 2.7793693474377204], {icon: markerAtm}).addTo(map)
    .bindPopup ("<h3>Sabadell Bank</h3>9 minuti")
    .openPopup();

  L.marker([41.79343948690455, 2.7817912611668643], {icon: markerAtm}).addTo(map)
    .bindPopup ("<h3>Caixa Bank</h3>9 minuti")
    .openPopup();

  L.marker([41.70782033264506, 2.8388852260650985], {icon: markerAtm}).addTo(map)
    .bindPopup ("<h3>Sabadell Bank</h3>17 minuti")
    .openPopup();

  L.marker([41.70663666110741, 2.835305435876083], {icon: markerAtm}).addTo(map)
    .bindPopup ("<h3>Euro Automatic Cash</h3>14 minuti")
    .openPopup();

  /*Spiagge*/

  
</script>



</body>
</html>
