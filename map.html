<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FavollApp – Mappa</title>

  <!-- Stile app -->
  <link rel="stylesheet" href="style.css">

  <!-- Font Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Iosevka+Charon:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Leckerli+One&family=Momo+Signature&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">

  <!-- Icone FontAwesome -->
  <script src="https://kit.fontawesome.com/de9ea88d4a.js" crossorigin="anonymous" defer></script>

  <!-- Leaflet (mappa interattiva) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js" defer></script>

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/Orange-Crab-Clipart-Transparent-PNG.png">

  <!-- Logica mappa (markers + sidebar categorie) -->
  <script src="map.js" defer></script>
</head>
<body>

  <!-- Header con logo -->
  <div class="header">
    <a href="index.html" class="header-title">FavollApp</a>&ensp;
    <a href="index.html">
      <img id="favollo-img" src="assets/Orange-Crab-Clipart-Transparent-PNG.png" alt="Logo Favollo">
    </a>
  </div>

  <div class="container">

    <!-- Titolo pagina -->
    <div class="title">
      <h1>La mappa del Favollo</h1>
      <h3>Luoghi vicino a noi</h3>
    </div>

    <br>

    <!-- Mappa Leaflet (altezza fissa, popolata da map.js) -->
    <div id="map" style="height: 400px;"></div>

    <!-- Sidebar categorie luoghi (popolata da map.js) -->
    <div id="categories"></div>

  </div>

</body>
</html>
