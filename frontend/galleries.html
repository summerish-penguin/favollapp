<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FavollApp</title>

    <!-- Stile -->
    <link rel="stylesheet" href="style.css" />

    <!-- Font Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Iosevka+Charon:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Leckerli+One&family=Momo+Signature&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />

    <!-- Icone FontAwesome -->
    <script
      src="https://kit.fontawesome.com/de9ea88d4a.js"
      crossorigin="anonymous"
      defer
    ></script>

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/Orange-Crab-Clipart-Transparent-PNG.png"
    />

    <script src="galleries.js" defer></script>
  </head>

  <body>
    <!-- Header con logo -->
    <div class="header">
      <a href="index.html" class="header-title">FavollApp</a>&ensp;
      <a href="index.html">
        <img
          id="favollo-img"
          src="assets/Orange-Crab-Clipart-Transparent-PNG.png"
          alt="Logo Favollo"
        />
      </a>
    </div>

    <div class="container">

        <div class="title">
        <h1>La tana del Favollo</h1>
        <h3>Foto della nostra casa</h3>
      </div>

      <div class="ss-wrap">
        <!-- traccia slide -->
        <div class="ss-box" id="ss-box">

          <!-- indicatori dot -->
          <div class="ss-dots" id="ss-dots"></div>

          <div class="ss-track" id="ss-track">
            <!-- le slide vengono generate da JS — vedi array PHOTOS sotto -->

            <button class="ss-btn ss-prev" id="ss-prev" aria-label="Precedente">
              <svg viewBox="0 0 24 24">
                <polyline points="15 18 9 12 15 6" />
              </svg>
            </button>

            <button class="ss-btn ss-next" id="ss-next" aria-label="Successiva">
              <svg viewBox="0 0 24 24">
                <polyline points="9 18 15 12 9 6" />
              </svg>
            </button>

            <div class="ss-counter" id="ss-counter">1 / 1</div>
          </div>

          <div class="meta-pills"> 
            <div class="meta-pill" id="ss-desc"></div>
          </div>

          <!-- controlli automatici -->
          <div class="ss-controls">
            <button class="ss-play" id="ss-play">⏸ Pausa</button>
            <label class="ss-speed-label">
              Velocità
              <input
                type="range"
                id="ss-speed"
                min="1"
                max="10"
                step="1"
                value="4"
              />
              <span class="ss-speed-val" id="ss-speed-out">4s</span>
            </label>
          </div>

        </div>


      </div>
    </div>
  </body>
</html>
