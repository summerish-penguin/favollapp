<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FavollApp</title>

    <!-- Stile -->
    <link rel="stylesheet" href="style.css" />

    <!-- Font Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Iosevka+Charon:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Leckerli+One&family=Momo+Signature&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />

    <!-- Icone FontAwesome -->
    <script
      src="https://kit.fontawesome.com/de9ea88d4a.js"
      crossorigin="anonymous"
      defer
    ></script>

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/Orange-Crab-Clipart-Transparent-PNG.png"
    />

    <script src="galleries.js" defer></script>
  </head>

  <body>
    <!-- Header con logo -->
    <div class="header">
      <a href="index.html" class="header-title">FavollApp</a>&ensp;
      <a href="index.html">
        <img
          id="favollo-img"
          src="assets/Orange-Crab-Clipart-Transparent-PNG.png"
          alt="Logo Favollo"
        />
      </a>
    </div>

    <div class="container">
      <div class="title" id="user-gallery">
        <h1>Le nostre foto 🎞️</h2>
        <h3>Carica le foto della vacanza e aggiungile alle slide</h4>
        
        <div class="ss-wrap">
          <div class="ss-box" id="user-ss-box">
            <!-- UPLOAD -->
            <div style="text-align: center; margin-bottom: 10px">
              <input type="file" id="user-upload" accept="image/*" multiple />
            </div>
            
            <button id="user-manage-btn">Gestisci gallery</button>
            
            <div class="ss-dots" id="user-ss-dots"></div>
            
            <div class="ss-track" id="user-ss-track">
              <button class="ss-btn ss-prev" id="user-ss-prev">‹</button>
              
              <button class="ss-btn ss-next" id="user-ss-next">›</button>
              
              <div class="ss-counter" id="user-ss-counter">0 / 0</div>
            </div>
            
            <!-- controlli automatici -->
            <div class="ss-controls">
              <button class="ss-play" id="user-ss-play">⏸ Slideshow</button>
              <label class="ss-speed-label">
                Velocità
                <input
                type="range"
                id="user-ss-speed"
                min="1"
                max="10"
                step="1"
                value="4"
                />
                <span class="ss-speed-val" id="user-ss-speed-out">4s</span>
              </label>
            </div>
          </div>
        </div>
      </div>

      <br />

      <!-- seconda gallery-->

      <div class="title" id="house-gallery">
        <h1>La tana del Favollo 🏡</h1>
        <h3>le foto della nostra casa</h3>
        
        <div class="ss-wrap">
          <!-- traccia slide -->
          <div class="ss-box" id="ss-box">
            <!-- indicatori dot -->
            <div class="ss-dots" id="ss-dots"></div>

            <div class="ss-track" id="ss-track">
              <!-- le slide vengono generate da JS — vedi array PHOTOS sotto -->
              
              <button class="ss-btn ss-prev" id="ss-prev">‹</button>
              
              <button class="ss-btn ss-next" id="ss-next">›</button>
              
              <div class="ss-counter" id="ss-counter">1 / 1</div>
            </div>
            
            <div class="meta-pills">
              <div class="meta-pill" id="ss-desc"></div>
            </div>
            
            <!-- controlli automatici -->
            <div class="ss-controls">
              <button class="ss-play" id="ss-play">⏸ Slideshow</button>
              <label class="ss-speed-label">
                Velocità
                <input
                type="range"
                id="ss-speed"
                min="1"
                max="10"
                step="1"
                value="4"
              />
              <span class="ss-speed-val" id="ss-speed-out">4s</span>
            </label>
          </div>
        </div>
      </div>
      </div>
    </div>

    <div id="user-modal" class="modal hidden">
      <div class="modal-content">
        <button id="user-close-modal" class="modal-close">✕</button>

        <h3>Gestione foto</h3>
        <div id="user-photo-list"></div>
      </div>
    </div>
  </body>
</html>
