<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FavollApp – Agent</title>

    <!-- Applica subito il tema salvato (o quello di sistema) prima del paint, per evitare un flash -->
    <script>
      (function () {
        var stored = localStorage.getItem('favollapp-theme');
        var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>

    <link rel="stylesheet" href="style.css" />

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Momo+Signature&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <!-- FontAwesome -->
    <script
      src="https://kit.fontawesome.com/de9ea88d4a.js"
      crossorigin="anonymous"
      defer
    ></script>

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/Orange-Crab-Clipart-Transparent-PNG.png"
    />

    <!-- JS -->
    <script src="config.js" defer></script>
    <script src="theme-toggle.js" defer></script>
    <script src="agent.js" defer></script>

    <!-- Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  </head>

  <body>
    <!-- HEADER -->
    <div class="header">
      <a href="index.html" class="header-title">FavollApp</a>

      <a href="index.html">
        <img
          id="favollo-img"
          src="assets/Orange-Crab-Clipart-Transparent-PNG.png"
          alt="Logo Favollo"
        />
      </a>&ensp;
      <button class="theme-toggle" id="theme-toggle" aria-label="Passa a modalità scura" aria-pressed="false">
        <span class="icons" aria-hidden="true"><span>☀️</span><span>🌙</span></span>
        <span class="thumb"></span>
      </button>
    </div>

    <!-- PAGE -->
    <div class="container">
      <!-- TITLE -->
      <div class="title">
        <h1>FavollAgent</h1>
        <h3>Un assistente AI basato su Llama 4 Scout e allenato sulla base dati di FavollApp</h3>
      </div>

      <br />

      <!-- CHAT CARD -->
      <div class="chat-card">
        <!-- FEED -->
        <div class="agent-chat-wrapper">
          <div id="agent-chat-messages" class="agent-chat-messages">
            <!-- Messaggio agente -->
            <div class="agent-row">
              <div class="agent-bubble">Ciao! Come posso aiutarti?</div>
            </div>
          </div>
        </div>
        <!-- INPUT AREA -->
        <div class="chatbot-prompt-row">
          <input
            id="agent-input"
            type="text"
            class="modal-input"
            placeholder="Scrivi un messaggio..."
          />

          <button id="agent-send">➤</button>
        </div>

        <!-- Disclaimer -->
        <div class="warning-text-chat">
          L'AI può commettere errori, verifica le risposte e i contenuti
          generati dal chatbot.
          L'assistente utilizza un modello ad accesso gratuito, con token limitati.
        </div>
      </div>
    </div>
  </body>
</html>
