<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FavollApp – Accedi</title>

    <!-- Applica subito il tema salvato (o quello di sistema) prima del paint, per evitare un flash -->
    <script>
      (function () {
        var stored = localStorage.getItem('favollapp-theme');
        var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>

    <!-- Se sei già loggato salti direttamente alla home -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('favollapp-user')) window.location.replace('index.html');
        } catch (e) {}
      })();
    </script>

    <!-- Stile -->
    <link rel="stylesheet" href="style.css" />

    <!-- Font Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Momo+Signature&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/Orange-Crab-Clipart-Transparent-PNG.png"
    />

    <script src="config.js" defer></script>
    <script src="theme-toggle.js" defer></script>
    <script src="ui-feedback.js" defer></script>
    <script src="auth.js" defer></script>
    <script src="login.js" defer></script>
  </head>
  <body>
    <!-- Header con logo -->
    <div class="header">
      <a href="index.html" class="header-title">FavollApp</a>
      <a href="index.html">
        <img
          id="favollo-img"
          src="assets/Orange-Crab-Clipart-Transparent-PNG.png"
          alt="Logo Favollo"
        />
      </a>&ensp;
      <button class="theme-toggle" id="theme-toggle" aria-label="Passa a modalità scura" aria-pressed="false">
        <span class="icons" aria-hidden="true"><span>☀️</span><span>🌙</span></span>
        <span class="thumb"></span>
      </button>
    </div>

    <div class="container">
      <div class="title">
        <h1>Accedi a Favollapp</h1>
        <h3>Seleziona il tuo nome e la tua password</h3>
      </div>

      <br />

      <form class="login-card" id="login-form" autocomplete="off">
        <label class="login-label" for="login-user">Chi sei</label>
        <select class="modal-input" id="login-user" required>
          <option value="" disabled selected>Seleziona il tuo nome…</option>
        </select>

        <label class="login-label" for="login-password">Password</label>
        <input
          class="modal-input"
          id="login-password"
          type="password"
          placeholder="La tua password"
          autocomplete="current-password"
          required
        />

        <p class="login-hint" id="login-hint">
          Primo accesso? La password che scegli ora diventerà la tua.
        </p>

        <button class="modal-create-btn login-submit" type="submit" id="login-submit">Entra</button>
      </form>
    </div>
  </body>
</html>
