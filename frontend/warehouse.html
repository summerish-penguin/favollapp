<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FavollApp – Bagaglio</title>

    <!-- Applica subito il tema salvato (o quello di sistema) prima del paint, per evitare un flash -->
    <script>
      (function () {
        var stored = localStorage.getItem('favollapp-theme');
        var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>

    <!-- Stile -->
    <link rel="stylesheet" href="style.css" />

    <!-- Font Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Momo+Signature&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- Icone FontAwesome -->
    <script
      src="https://kit.fontawesome.com/de9ea88d4a.js"
      crossorigin="anonymous"
      defer
    ></script>

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/Orange-Crab-Clipart-Transparent-PNG.png"
    />

    <!-- Logica warehouse -->
    <script src="config.js" defer></script>
    <script src="theme-toggle.js" defer></script>
    <script src="ui-feedback.js" defer></script>
    <script src="warehouse.js" defer></script>
  </head>
  <body>
    <!-- Header con logo -->
    <div class="header">
      <a href="index.html" class="header-title">FavollApp</a>
      <a href="index.html">
        <img
          id="favollo-img"
          src="assets/Orange-Crab-Clipart-Transparent-PNG.png"
          alt="Logo Favollo"
        />
      </a>&ensp;
      <button class="theme-toggle" id="theme-toggle" aria-label="Passa a modalità scura" aria-pressed="false">
        <span class="icons" aria-hidden="true"><span>☀️</span><span>🌙</span></span>
        <span class="thumb"></span>
      </button>
    </div>

    <div class="container">
      <!-- Titolo pagina -->
      <div class="title">
        <h1>Lo zaino del Favollo</h1>
        <h3>Chi porta cosa?</h3>
      </div>

      <br />

      <!-- Input nome utente 
  <input id="username" list="users-list">
  <datalist id="users-list"></datalist>-->

      <select id="username">
        <option value="" disabled selected>Seleziona il tuo nome</option>
      </select>
      <datalist id="users-list"></datalist>

      <!-- Lista oggetti: generata dinamicamente dal JS -->
      <div id="warehouse-container"></div>

      <div id="add-item-cnt">
        <button id="add-item-btn">Aggiungi un oggetto</button>
      </div>
    </div>
  </body>
</html>
