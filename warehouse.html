<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warehouse</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Iosevka+Charon:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Leckerli+One&family=Momo+Signature&display=swap" rel="stylesheet">
</head>
<body>

<div class="header">
  FavollApp &ensp;
  <img id="favollo-img" src="assets/Orange-Crab-Clipart-Transparent-PNG.png" alt="">
</div>

<div class="container">

  <h1>Favollo Warehouse</h1>
  <h3>Chi porta cosa?</h3>
<br>
<br>
  <input id="username" placeholder="Il tuo nome" />

  <ul id="items-list">

    <li class="item">
      <div class="item-content">
        <span>Ombrellone</span>
        <button class="take-btn">Lo porto io!</button>
      </div>
      <div class="people"></div>
    </li>

    <li class="item">
      <div class="item-content">
        <span>Borsa frigo</span>
        <button class="take-btn">Lo porto io!</button>
      </div>
      <div class="people"></div>
    </li>

    <li class="item">
      <div class="item-content">
        <span>Ghiaccini</span>
        <button class="take-btn">Lo porto io!</button>
      </div>
      <div class="people"></div>
    </li>

        <li class="item">
      <div class="item-content">
        <span>Sedia da spiaggia</span>
        <button class="take-btn">Lo porto io!</button>
      </div>
      <div class="people"></div>
    </li>

    <li class="item">
      <div class="item-content">
        <span>Carte da gioco</span>
        <button class="take-btn">Lo porto io!</button>
      </div>
      <div class="people"></div>
    </li>

    <li class="item">
      <div class="item-content">
        <span>Crema solare</span>
        <button class="take-btn">Lo porto io!</button>
      </div>
      <div class="people"></div>
    </li>

  </ul>

</div>

<script src="warehouse.js"></script>

</body>
</html>
